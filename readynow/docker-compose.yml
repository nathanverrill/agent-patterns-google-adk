services:
  # 1. FastAPI API Gateway & Multi-Agent Framework Core
  backend-engine:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: readynow_backend_engine
    ports:
      - "8008:8000"
    environment:
      # --- Model: any OpenAI-compatible endpoint, or Gemini ---------------
      # Set these in readynow/.env (copy .env.example) or export them first.
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AGENT_MODEL_NAME=${AGENT_MODEL_NAME:-}      # legacy alias for LLM_MODEL
      # --- Optional extras ------------------------------------------------
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}          # premium geocoding; else Nominatim
      - READYNOW_CONTACT=${READYNOW_CONTACT:-}      # User-Agent identity for NWS/Nominatim/OSRM
      - OSRM_BASE_URL=${OSRM_BASE_URL:-}            # self-hosted OSRM; else the public demo server
      - LLM_WARMUP=${LLM_WARMUP:-true}              # 1-token call at boot; keeps the first query fast
      - LITELLM_NUM_RETRIES=${LITELLM_NUM_RETRIES:-3}
      # Use LiteLLM's bundled pricing table rather than fetching it at runtime.
      - LITELLM_LOCAL_MODEL_COST_MAP=True
      - ADK_SUPPRESS_GEMINI_LITELLM_WARNINGS=true
      - ADK_ENABLE_TRACING=false # limit noise in logs running locally with no otel
    # Lets LLM_BASE_URL=http://host.docker.internal:11434/v1 reach an Ollama /
    # LM Studio / vLLM server running on the host, on Linux as well as Mac.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # 2. Lightweight Web Server serving the Frontend Dashboard
  frontend-ui:
    image: nginx:alpine
    container_name: readynow_frontend_ui
    ports:
      - "9009:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend-engine
